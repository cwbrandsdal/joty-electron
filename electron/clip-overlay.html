<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>Joty screen clip</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        cursor: crosshair;
        user-select: none;
        font:
          13px "Segoe UI",
          system-ui,
          sans-serif;
      }
      #shot {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-size: 100% 100%;
      }
      #shade {
        position: fixed;
        inset: 0;
        background: rgba(13, 31, 49, 0.42);
      }
      #box {
        position: fixed;
        display: none;
        outline: 1px solid #e0551f;
        box-shadow: 0 0 0 9999px rgba(13, 31, 49, 0.42);
        background-size: var(--bw) var(--bh);
      }
      body.selecting #shade {
        display: none;
      }
      #hint {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 3px;
        background: #1d261e;
        color: #eef2e6;
        pointer-events: none;
      }
      #size {
        position: fixed;
        padding: 2px 6px;
        border-radius: 2px;
        background: #e0551f;
        color: #1d261e;
        display: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="shot"></div>
    <div id="shade"></div>
    <div id="box"></div>
    <div id="size"></div>
    <div id="hint">Drag to clip. Esc cancels.</div>
    <script>
      const shot = document.getElementById("shot");
      const box = document.getElementById("box");
      const size = document.getElementById("size");
      const hint = document.getElementById("hint");
      let start = null;
      let rect = null;
      let finished = false;

      function finish(value) {
        if (finished) return;
        finished = true;
        window.clip.finish(value);
      }

      window.clip.onImage((image) => {
        const img = new Image();
        img.onload = () => {
          shot.style.backgroundImage = `url("${image.src}")`;
          box.style.backgroundImage = `url("${image.src}")`;
          box.style.setProperty("--bw", `${window.innerWidth}px`);
          box.style.setProperty("--bh", `${window.innerHeight}px`);
          requestAnimationFrame(() => window.clip.ready());
        };
        img.onerror = () => finish(null);
        img.src = image.src;
      });

      function draw() {
        if (!rect) return;
        box.style.display = "block";
        box.style.left = `${rect.x}px`;
        box.style.top = `${rect.y}px`;
        box.style.width = `${rect.width}px`;
        box.style.height = `${rect.height}px`;
        box.style.backgroundPosition = `${-rect.x}px ${-rect.y}px`;
        size.style.display = "block";
        size.textContent = `${Math.round(rect.width)} × ${Math.round(rect.height)}`;
        size.style.left = `${rect.x}px`;
        size.style.top = `${Math.max(0, rect.y - 24)}px`;
      }

      window.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return finish(null);
        start = { x: e.clientX, y: e.clientY };
        rect = { x: start.x, y: start.y, width: 0, height: 0 };
        document.body.classList.add("selecting");
        hint.style.display = "none";
        document.body.setPointerCapture?.(e.pointerId);
      });
      window.addEventListener("pointermove", (e) => {
        if (!start) return;
        rect = {
          x: Math.min(start.x, e.clientX),
          y: Math.min(start.y, e.clientY),
          width: Math.abs(e.clientX - start.x),
          height: Math.abs(e.clientY - start.y),
        };
        draw();
      });
      window.addEventListener("pointerup", () => {
        if (!start) return;
        start = null;
        if (!rect || rect.width < 3 || rect.height < 3) {
          rect = null;
          box.style.display = "none";
          size.style.display = "none";
          document.body.classList.remove("selecting");
          hint.style.display = "block";
          return;
        }
        finish(rect);
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") finish(null);
      });
      window.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        finish(null);
      });
      window.addEventListener("blur", () => {
        // Losing focus mid-clip (Alt+Tab, Win key) cancels rather than hiding
        // a full-screen window the person can no longer see.
        if (document.body.dataset.shown) finish(null);
      });
      window.addEventListener("focus", () => {
        document.body.dataset.shown = "1";
      });
    </script>
  </body>
</html>
